<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桥梁承重受力模拟演示</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>桥梁承重受力模拟演示</h1>
            <p class="subtitle">梁式桥 vs 拱式桥 - 力学承重差异直观展示</p>
        </header>

        <div class="main-content">
            <div class="canvas-wrapper">
                <canvas id="bridgeCanvas" width="900" height="500"></canvas>
                <div class="info-panel">
                    <div class="info-item">
                        <span class="label">当前桥型:</span>
                        <span id="bridgeType" class="value">梁式桥</span>
                    </div>
                    <div class="info-item">
                        <span class="label">承重状态:</span>
                        <span id="stressStatus" class="value status-normal">正常</span>
                    </div>
                    <div class="info-item">
                        <span class="label">最大形变:</span>
                        <span id="maxDeflection" class="value">0 px</span>
                    </div>
                    <div class="info-item">
                        <span class="label">总承重:</span>
                        <span id="totalWeight" class="value">0 kg</span>
                    </div>
                </div>
            </div>

            <div class="controls">
                <div class="control-section">
                    <h3>桥型选择</h3>
                    <div class="btn-group">
                        <button id="btnBeam" class="btn active">梁式桥</button>
                        <button id="btnArch" class="btn">拱式桥</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>桥梁参数</h3>
                    <div class="control-row">
                        <label>桥梁厚度: <span id="thicknessValue">8</span></label>
                        <input type="range" id="thickness" min="4" max="20" value="8">
                    </div>
                    <div class="control-row">
                        <label>支撑点数: <span id="supportValue">2</span></label>
                        <input type="range" id="supports" min="2" max="5" value="2" step="1">
                    </div>
                </div>

                <div class="control-section">
                    <h3>模拟控制</h3>
                    <div class="control-row">
                        <label>重物重量: <span id="weightValue">100</span> kg</label>
                        <input type="range" id="weight" min="50" max="500" value="100" step="10">
                    </div>
                    <div class="btn-group">
                        <button id="btnAddWeight" class="btn btn-primary">添加重物</button>
                        <button id="btnClearWeight" class="btn">清除重物</button>
                    </div>
                    <div class="btn-group">
                        <button id="btnTest" class="btn btn-warning">极限承重测试</button>
                        <button id="btnReset" class="btn btn-danger">重置模拟</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>显示选项</h3>
                    <div class="control-row checkbox-row">
                        <label><input type="checkbox" id="showStress" checked> 显示应力颜色</label>
                    </div>
                    <div class="control-row checkbox-row">
                        <label><input type="checkbox" id="showGrid" checked> 显示网格</label>
                    </div>
                </div>

                <div class="legend">
                    <h4>应力图例</h4>
                    <div class="legend-bar">
                        <div class="legend-item" style="background: #4ade80;">低</div>
                        <div class="legend-item" style="background: #facc15;">中</div>
                        <div class="legend-item" style="background: #f87171;">高</div>
                        <div class="legend-item" style="background: #7f1d1d;">极限</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tips">
            <p><strong>操作提示:</strong> 点击桥面任意位置可直接添加重物 | 拖动滑块调整参数 | 观察不同桥型在相同承重下的形变差异</p>
        </div>
    </div>

    <script src="src/js/physics.js"></script>
    <script src="src/js/bridge.js"></script>
    <script src="src/js/renderer.js"></script>
    <script src="src/js/main.js"></script>
</body>
</html>
